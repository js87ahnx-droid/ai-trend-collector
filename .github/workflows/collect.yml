name: collect

on:
  schedule:
    - cron: "37 * * * *"     # 매시 37분 (정각 혼잡 회피)
  workflow_dispatch:
    inputs:
      rewrite:
        description: "저장된 글을 쉬운 말로 다시 쓰기 (문체 변경 때 한 번)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/collect.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Test
        run: python -m pytest -q

      - name: Rewrite stored items
        if: github.event_name == 'workflow_dispatch' && inputs.rewrite
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m collector.rewrite

      - name: Collect
        if: github.event_name != 'push'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SEARCH_API_KEY: ${{ secrets.SEARCH_API_KEY }}
        run: python -m collector.main

      - name: Commit data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/items.json data/status.json data/skipped.json
          git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ) 수집" || exit 0
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done

      - run: python scripts/build_site.py _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
