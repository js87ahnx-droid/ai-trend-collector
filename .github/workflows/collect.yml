name: collect

on:
  schedule:
    - cron: "37 * * * *"     # 매시 37분 (정각 혼잡 회피)
  workflow_dispatch:
    inputs:
      rewrite:
        description: "저장된 글을 쉬운 말로 다시 쓰기 (문체 변경 때 한 번)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/collect.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90   # 수집: 호출 최대 5분 × (분류 1 + 상세 10건/4병렬 3묶음). 다시 쓰기 회차는 수집을 건너뛰고 저장된 글 전체를 처리
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Test
        run: python -m pytest -q

      - uses: actions/setup-node@v4
        if: github.event_name != 'push'
        with:
          node-version: "22"

      - name: Install Claude Code (구독 토큰으로 호출)
        if: github.event_name != 'push'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.292 && claude --version   # 옵션을 확인한 버전으로 고정
          python -c "from collector.claude_code import token_shape; print('토큰', token_shape())"

      - name: Rewrite stored items
        if: github.event_name == 'workflow_dispatch' && inputs.rewrite
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python -m collector.rewrite

      - name: Install browser when Threads is due
        if: github.event_name != 'push'
        run: |
          if python -m collector.sources.threadprofile data; then
            pip install playwright && playwright install --with-deps chromium || echo "브라우저 설치 실패 — 스레드만 건너뜀"
          fi

      - name: Collect
        if: github.event_name != 'push' && !inputs.rewrite
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SEARCH_API_KEY: ${{ secrets.SEARCH_API_KEY }}
        run: python -m collector.main

      - name: Commit data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/items.json data/status.json data/skipped.json
          git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ) 수집" || exit 0
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done

      - run: python scripts/build_site.py _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # 데이터 저장·배포와 별개로, 분류가 실패했거나 토큰이 없으면 이 job을 빨간색으로 표시해 알린다
  check:
    needs: collect
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: |
          python3 - <<'EOF'
          import json, sys
          run = json.load(open("data/status.json", encoding="utf-8")).get("run", {})
          note = run.get("note", "")
          print(note or "정상")
          broken = "분류 실패" in note or "건너뜀" in note or ("상세 실패" in note and not run.get("added"))
          sys.exit(1 if broken else 0)
          EOF

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
