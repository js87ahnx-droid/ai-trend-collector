<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e0f11" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AI 동향">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>AI 동향 수집함</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f6f4;--surface:#fff;--line:#e6e6e3;--text:#17181a;--muted:#62636a;--faint:#9fa0a6;--accent:#2f5bea;--tint:#eef2fe;--hot:#d9480f;--hover:#f7f8fb;--ok:#16a34a;--warn:#c2410c}
@media (prefers-color-scheme:dark){:root{--bg:#0e0f11;--surface:#16171a;--line:#26272b;--text:#ececee;--muted:#9a9aa3;--faint:#62626b;--accent:#7b9cff;--tint:#1a2240;--hot:#ff8a4c;--hover:#1c1e24;--ok:#22c55e;--warn:#f59e0b}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 "IBM Plex Sans KR",system-ui,-apple-system,sans-serif}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
.wrap{max-width:820px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 16px 60px}
header.top{display:flex;justify-content:space-between;align-items:baseline;gap:6px 12px;flex-wrap:wrap}
h1{font-size:20px;margin:0;font-weight:700}
h1 a:hover{color:var(--accent)}
.st{font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);margin-right:5px;vertical-align:2px}
.dot.late{background:var(--warn)}.late{color:var(--warn);font-weight:600}
nav{display:flex;gap:4px;margin:16px 0 16px;background:var(--surface);padding:4px;border-radius:10px;border:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{all:unset;cursor:pointer;padding:6px 11px;border-radius:7px;font-size:14px;color:var(--muted);white-space:nowrap}
nav button:hover{color:var(--text)}
nav button[aria-current="true"]{background:var(--tint);color:var(--accent);font-weight:700}
nav button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
nav .n{font-size:12px;opacity:.7;margin-left:4px}
.hot{display:inline-block;font-size:11px;font-weight:700;color:var(--hot);letter-spacing:.02em;margin-right:6px;vertical-align:1px}
.hero{display:block;background:var(--surface);border:1.5px solid var(--accent);border-radius:14px;padding:16px 18px;margin-bottom:8px}
.hero:hover{background:var(--hover)}
.hero .k{font-size:12px;font-weight:700;color:var(--accent)}
.hero .h{font-size:20px;font-weight:700;line-height:1.38;margin:5px 0 6px;overflow-wrap:anywhere}
.hero .w{font-size:14px;color:var(--muted)}
.subs{display:flex;flex-direction:column;gap:6px;margin-bottom:22px}
.subs a{display:flex;gap:12px;align-items:baseline;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-weight:600;font-size:15px;line-height:1.45}
.subs a:hover{background:var(--hover)}
.subs .no{color:var(--accent);font-weight:500}
.subs .h{flex:1;min-width:0;overflow-wrap:anywhere}
.subs .c{font-size:12px;font-weight:400;color:var(--faint);white-space:nowrap}
@media(max-width:520px){.subs .c{display:none}}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
.sec h2{font-size:14px;font-weight:700;margin:0;padding:10px 14px;background:var(--tint);display:flex;justify-content:space-between;align-items:baseline}
.sec h2 small{color:var(--accent);font-weight:600;font-size:13px}
.row{display:flex;gap:12px;align-items:baseline;padding:10px 14px;border-top:1px solid var(--line)}
.sec h2+.row{border-top:0}
.row:hover{background:var(--hover)}
.row .h{flex:1;min-width:0;overflow-wrap:anywhere}
.row .m{font-size:12px;color:var(--faint);white-space:nowrap}
@media(max-width:520px){.row{flex-direction:column;gap:1px}.row .m{white-space:normal}}
.newdot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:2px}
.row.old .h s{color:var(--faint)}
.row.old .to{display:block;color:var(--accent);font-size:12px;margin-top:1px}
.empty{color:var(--muted);text-align:center;padding:40px 12px;border:1px dashed var(--line);border-radius:12px;background:var(--surface)}
.back{color:var(--accent);font-size:14px;font-weight:600}
.dk{font-size:12px;font-weight:700;color:var(--accent);margin-top:16px}
.dh{font-size:23px;line-height:1.38;margin:6px 0 6px;overflow-wrap:anywhere}
.dm{font-size:13px;color:var(--muted)}
.orig{font-size:13px;color:var(--faint);margin-top:2px;overflow-wrap:anywhere}
.notice{margin-top:16px;padding:10px 12px;border:1px dashed var(--faint);border-radius:10px;font-size:14px}
.notice a{color:var(--accent)}
.blk{margin-top:24px}
.blk h3{font-size:14px;font-weight:700;margin:0 0 8px}
.sum{background:var(--tint);border-radius:12px;padding:12px 14px 12px 32px;margin:0}
.sum li{margin:4px 0}
.terms{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:0;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface)}
.terms dt{font-weight:700;white-space:nowrap}
.terms dd{margin:0;color:var(--muted);overflow-wrap:anywhere}
@media(max-width:420px){.terms{grid-template-columns:1fr;gap:0}.terms dd{margin-bottom:8px}}
ol.steps{margin:0;padding-left:22px}ol.steps li{margin:7px 0;overflow-wrap:anywhere}
ol.steps li::marker{color:var(--accent);font-weight:700}
.extra{color:var(--muted)}
code{font-family:"IBM Plex Mono",monospace;background:var(--hover);border:1px solid var(--line);padding:0 5px;border-radius:4px;font-size:13px;overflow-wrap:anywhere}
.fig{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface)}
.fig .ft{font-size:13px;color:var(--muted);margin-bottom:10px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmp div{padding:10px;border-radius:8px;background:var(--hover);overflow-wrap:anywhere}
.cmp div.after{background:var(--tint);box-shadow:inset 0 0 0 1px var(--accent)}
.cmp .l{font-size:11px;color:var(--muted);display:block;margin-bottom:4px;font-weight:600}
@media(max-width:480px){.cmp{grid-template-columns:1fr}}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.flow span.s{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:14px}
.flow span.a{color:var(--accent)}
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:13px}
.bars .bar{height:14px;border-radius:3px;background:var(--accent);min-width:2px}
.bars .bar.dim{background:var(--faint)}
.quote{font-size:19px;line-height:1.5;border-left:3px solid var(--accent);padding-left:14px}
.quote small{display:block;font-size:12px;color:var(--muted);margin-top:6px}
.was a{color:var(--muted)}.was s{color:var(--faint)}
.src{display:inline-block;margin-top:28px;background:var(--accent);color:#fff;padding:9px 16px;border-radius:9px;font-size:14px;font-weight:600}
.src:hover{filter:brightness(1.08)}
@media (prefers-color-scheme:dark){.src{color:#0e0f11}}
details.health{margin-top:36px;font-size:12px;color:var(--muted)}
details.health summary{cursor:pointer}
details.health table{border-collapse:collapse;margin-top:6px;width:100%}
details.health td{padding:3px 8px 3px 0;border-top:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
.err{color:var(--warn)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><h1><a href="#/">AI 동향 수집함</a></h1><div class="st" id="status" aria-live="polite"></div></header>
  <main id="app"></main>
  <details class="health" id="health"></details>
</div>
<script>
const CATS = [["tip", "활용 팁"], ["tool", "써볼 만한 도구"], ["biz", "사업 아이디어"], ["voice", "전문가 이야기"], ["shift", "업데이트 소식"]];
const CAT = Object.fromEntries(CATS);
const SRC = {gn: "긱뉴스", gnp: "GN⁺", hn: "Hacker News", reddit: "Reddit", threads: "Threads", gpters: "GPTERS",
             web: "웹", pod: "팟캐스트", ph: "Product Hunt", nl: "뉴스레터", news: "뉴스"};
const LATE_MS = 2 * 3600e3, POLL_MS = 5 * 60e3, PICK_WINDOW_MS = 48 * 3600e3, CAT_KEY = "ai-trend-cat";
const state = {items: [], status: null, loaded: false, error: null, cat: "all"};
try { const c = localStorage.getItem(CAT_KEY); if (c === "all" || CAT[c]) state.cat = c; } catch (_) {}

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const num = s => esc(s).replace(/\d[\d,.]*/g, d => `<span class="mono">${d}</span>`);
const rich = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");   // 단계 속 `명령어`만 코드로
const safeUrl = u => /^https:\/\//i.test(u || "") ? u : null;
const itemHref = id => `#/item/${encodeURIComponent(id)}`;
const byId = id => state.items.find(i => i.id === id);
const live = () => state.items.filter(i => CAT[i.cat] && !i.superseded_by);
const visibleAll = () => state.items.filter(i => CAT[i.cat]);
const t = s => Date.parse(s) || 0;
const HOT = '<span class="hot">화제</span>';
const hot = it => it.buzz === true ? HOT : "";

function ago(iso, now = Date.now()) {
  const ms = t(iso); if (!ms) return "-";
  const m = Math.max(0, Math.floor((now - ms) / 60e3));
  if (m < 1) return "방금";
  if (m < 60) return `${m}분 전`;
  const h = Math.floor(m / 60);
  return h < 24 ? `${h}시간 전` : `${Math.floor(h / 24)}일 전`;
}

function renderStatus() {
  const el = document.getElementById("status");
  const lr = state.status?.last_run;
  if (state.error && !state.loaded) { el.innerHTML = `<span class="late">데이터를 불러오지 못했어요</span>`; return; }
  if (!lr) { el.innerHTML = `<span class="dot late"></span>아직 수집 기록 없음`; return; }
  const late = Date.now() - t(lr) > LATE_MS;
  el.innerHTML = `<span class="dot${late ? " late" : ""}"></span>${num(ago(lr))} 업데이트${late ? ` · <span class="late">업데이트 늦어짐</span>` : ""} · ${num(live().length)}건`;
}

const isNew = it => state.status?.last_run && it.collected_at === state.status.last_run;
// 목록 순서: 화제 먼저, 그다음 최근 회차, 같은 회차 안에선 우선순위 높은 순
const sortItems = list => list.slice().sort((a, b) => ((b.buzz === true) - (a.buzz === true)) ||
  (t(b.collected_at) - t(a.collected_at)) || ((b.pick ?? 0) - (a.pick ?? 0)));

function row(it) {
  if (it.superseded_by) {
    const to = byId(it.superseded_by);
    return `<a class="row old" href="${itemHref(it.id)}"><div class="h"><s>${esc(it.headline)}</s>` +
      (to ? `<span class="to">→ ${esc(to.headline)}</span>` : "") + `</div></a>`;
  }
  const meta = [it.tag, SRC[it.source] || it.source].filter(Boolean).map(esc).join(" · ");
  return `<a class="row" href="${itemHref(it.id)}"><div class="h">${isNew(it) ? '<span class="newdot" title="새로 들어옴"></span>' : ""}${hot(it)}${esc(it.headline)}</div><span class="m">${meta}</span></a>`;
}

function renderNav() {
  const counts = c => c === "all" ? live().length : live().filter(i => i.cat === c).length;
  return `<nav aria-label="카테고리">${[["all", "전체"], ...CATS].map(([k, n]) =>
    `<button data-cat="${k}" aria-current="${state.cat === k}">${esc(n)}<span class="n mono">${counts(k)}</span></button>`).join("")}</nav>`;
}

function renderPicks() {
  const now = Date.now();
  let pool = live().filter(i => now - t(i.collected_at) < PICK_WINDOW_MS);
  if (pool.length < 4) pool = live();
  const picks = pool.slice().sort((a, b) => ((b.pick ?? 0) - (a.pick ?? 0)) || ((b.buzz === true) - (a.buzz === true)) ||
    (t(b.collected_at) - t(a.collected_at))).slice(0, 4);
  if (!picks.length) return "";
  const [a, ...rest] = picks;
  return `<a class="hero" href="${itemHref(a.id)}"><div class="k">오늘 먼저 볼 것 · ${esc(CAT[a.cat])}${a.buzz === true ? ` · ${HOT}` : ""}</div>` +
    `<div class="h">${esc(a.headline)}</div>${a.why ? `<div class="w">${esc(a.why)}</div>` : ""}</a>` +
    (rest.length ? `<div class="subs">${rest.map((it, i) => `<a href="${itemHref(it.id)}"><span class="no mono">${i + 2}</span>` +
      `<span class="h">${hot(it)}${esc(it.headline)}</span><span class="c">${esc(CAT[it.cat])}</span></a>`).join("")}</div>` : `<div class="subs"></div>`);
}

function section(name, list, showCount) {
  const n = list.filter(i => !i.superseded_by).length;
  return `<section class="sec" aria-label="${esc(name)}"><h2>${esc(name)}${showCount ? `<small class="mono">${n}</small>` : ""}</h2>${list.map(row).join("")}</section>`;
}

function renderIndex() {
  if (!state.items.length) return renderNav() + `<div class="empty">아직 정리된 글이 없어요. 수집이 돌면 바로 쓸 수 있는 팁·도구·전문가 이야기가 여기에 쌓입니다.</div>`;
  if (state.cat === "all") {
    return renderNav() + renderPicks() + CATS.map(([k, n]) => {
      const g = sortItems(visibleAll().filter(i => i.cat === k));
      return g.length ? section(n, g, true) : "";
    }).join("");
  }
  const g = sortItems(visibleAll().filter(i => i.cat === state.cat));
  return renderNav() + (g.length ? section(CAT[state.cat], g, false)
    : `<div class="empty">이 카테고리엔 아직 글이 없어요.</div>`);
}

function figure(f) {
  if (!f) return "";
  const title = f.title ? `<div class="ft">${esc(f.title)}</div>` : "";
  let body = "";
  if (f.type === "compare") {
    body = `<div class="cmp"><div><span class="l">${esc(f.before_label)}</span>${esc(f.before)}</div><div class="after"><span class="l">${esc(f.after_label)}</span>${esc(f.after)}</div></div>`;
  } else if (f.type === "flow") {
    body = `<div class="flow">${f.steps.map(s => `<span class="s">${esc(s)}</span>`).join('<span class="a">→</span>')}</div>`;
  } else if (f.type === "bars") {
    const max = Math.max(...f.bars.map(b => b.value), 1);
    const top = Math.max(...f.bars.map(b => b.value));
    body = `<div class="bars">${f.bars.map(b => `<span>${esc(b.label)}</span><div class="bar${b.value === top ? "" : " dim"}" style="width:${(b.value / max * 100).toFixed(1)}%"></div><span class="mono">${esc(b.value)}${esc(f.unit)}</span>`).join("")}</div>`;
  } else if (f.type === "quote") {
    body = `<div class="quote">${esc(f.text)}<small>${f.speaker ? `— ${esc(f.speaker)} · ` : ""}요지 정리(직접 인용 아님)</small></div>`;
  } else return "";
  return `<section class="blk"><h3>그림으로 보기</h3><div class="fig">${title}${body}</div></section>`;
}

function terms(list) {
  const ok = (list || []).filter(x => x && x.term && x.meaning);
  return ok.length ? `<section class="blk"><h3>모르는 말 풀이</h3><dl class="terms">${ok.map(x => `<dt>${esc(x.term)}</dt><dd>${esc(x.meaning)}</dd>`).join("")}</dl></section>` : "";
}

function renderDetail(id) {
  const it = byId(id);
  if (!it) return `<a class="back" href="#/">← 목록으로</a><div class="empty" style="margin-top:16px">이 글은 보관 기간이 지나 삭제됐어요.</div>`;
  const d = it.detail || {points: []};
  const url = safeUrl(it.url);
  const to = it.superseded_by && byId(it.superseded_by);
  const was = it.replaces && byId(it.replaces);
  const meta = [it.tag, SRC[it.source] || it.source].filter(Boolean).map(esc).join(" · ");
  return `<a class="back" href="#/">← 목록으로</a>
<div class="dk">${esc(CAT[it.cat])}${it.buzz === true ? ` · ${HOT}` : ""}</div>
<h2 class="dh">${it.superseded_by ? `<s>${esc(it.headline)}</s>` : esc(it.headline)}</h2>
<div class="dm">${meta} · ${num(ago(it.collected_at))} 수집</div>
<div class="orig">원래 제목: ${esc(it.title)}</div>
${it.superseded_by ? `<div class="notice">더 나은 내용으로 대체됐어요${to ? ` → <a href="${itemHref(to.id)}">${esc(to.headline)}</a>` : ""}</div>` : ""}
<section class="blk"><h3>한 줄로 말하면</h3><ul class="sum">${d.points.map(p => `<li>${esc(p)}</li>`).join("")}</ul></section>
${figure(d.figure)}
${d.steps?.length ? `<section class="blk"><h3>${it.cat === "voice" ? "나에게 적용하면" : "따라 해보기"}</h3><ol class="steps">${d.steps.map(s => `<li>${rich(s)}</li>`).join("")}</ol></section>` : ""}
${d.extra ? `<section class="blk"><h3>알아두면 좋은 점</h3><div class="extra">${esc(d.extra)}</div></section>` : ""}
${terms(d.terms)}
${was ? `<section class="blk"><h3>이 글이 대신하는 이전 글</h3><div class="was"><a href="${itemHref(was.id)}"><s>${esc(was.headline)}</s></a></div></section>` : ""}
${url ? `<a class="src" href="${esc(url)}" target="_blank" rel="noopener noreferrer">원문 읽기 ↗</a>` : ""}`;
}

function renderHealth() {
  const s = state.status, el = document.getElementById("health");
  if (!s?.sources) { el.innerHTML = ""; return; }
  const rows = Object.entries(s.sources).map(([name, r]) =>
    `<tr><td class="mono">${esc(name)}</td><td>${num(r.fetched ?? 0)}건 수집 · ${num(r.kept ?? 0)}건 저장</td>` +
    `<td class="${r.error ? "err" : ""}">${esc(r.error || r.note || "정상")}</td></tr>`).join("");
  el.innerHTML = `<summary>수집 상태 (마지막 회차)</summary>${s.run?.note ? `<p class="err">${esc(s.run.note)}</p>` : ""}<table>${rows}</table>`;
}

function route() {
  const m = location.hash.match(/^#\/item\/(.+)$/);
  return m ? {view: "item", id: decodeURIComponent(m[1])} : {view: "index"};
}

let lastView = null, indexScroll = 0;
function render() {
  renderStatus(); renderHealth();
  const app = document.getElementById("app");
  if (!state.loaded) { app.innerHTML = state.error ? `<div class="empty">${esc(state.error)}</div>` : ""; return; }
  const r = route();
  const key = r.view === "item" ? `item:${r.id}` : "index";
  if (lastView === "index" && key !== "index") indexScroll = window.scrollY;
  app.innerHTML = r.view === "item" ? renderDetail(r.id) : renderIndex();
  if (key !== lastView) {
    if (r.view === "item") window.scrollTo(0, 0);
    else if (lastView) window.scrollTo(0, indexScroll);
    const it = r.view === "item" && byId(r.id);
    document.title = it ? `${it.headline} — AI 동향 수집함` : "AI 동향 수집함";
  }
  lastView = key;
}

async function getJson(name) {
  for (const base of ["data/", "../data/"]) {
    try {
      const r = await fetch(`${base}${name}?t=${Date.now()}`, {cache: "no-store"});
      if (r.ok) return await r.json();
    } catch (_) {}
  }
  throw new Error(`${name} 불러오기 실패`);
}

async function load() {
  try {
    const [items, status] = await Promise.all([getJson("items.json"), getJson("status.json")]);
    state.items = items.schema === 2 && Array.isArray(items.items) ? items.items : [];
    state.status = status; state.loaded = true; state.error = null;
  } catch (e) {
    state.error = "데이터를 불러오지 못했어요. 잠시 후 다시 시도합니다.";
  }
  render();
}

const TABS = ["all", ...CATS.map(([k]) => k)];
function setCat(c, fromSwipe) {
  state.cat = c;
  try { localStorage.setItem(CAT_KEY, c); } catch (_) {}
  render();
  const nav = document.querySelector("#app nav"), b = nav?.querySelector("button[aria-current=true]");
  if (!nav || !b) return;
  const nr = nav.getBoundingClientRect(), br = b.getBoundingClientRect();   // 고른 탭이 탭 줄 가운데 오게
  nav.scrollLeft += br.left + br.width / 2 - (nr.left + nr.width / 2);
  if (fromSwipe && nav.getBoundingClientRect().top < 0) nav.scrollIntoView({block: "start"});
}
document.getElementById("app").addEventListener("click", e => {
  const b = e.target.closest("nav button"); if (!b) return;
  setCat(b.dataset.cat);
});
// 목록 화면에서 좌우로 밀면 옆 탭으로 — 탭 줄 자체(가로 스크롤)나 세로 스크롤 중엔 무시
let swipe = null;
document.addEventListener("touchstart", e => {
  swipe = e.touches.length === 1 && route().view === "index" && !e.target.closest("nav")
    ? {x: e.touches[0].clientX, y: e.touches[0].clientY} : null;
}, {passive: true});
document.addEventListener("touchend", e => {
  if (!swipe) return;
  const dx = e.changedTouches[0].clientX - swipe.x, dy = e.changedTouches[0].clientY - swipe.y;
  swipe = null;
  if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
  const i = TABS.indexOf(state.cat) + (dx < 0 ? 1 : -1);
  if (i >= 0 && i < TABS.length) setCat(TABS[i], true);
});
window.addEventListener("hashchange", render);
render(); load();
setInterval(renderStatus, 60e3);
setInterval(load, POLL_MS);
</script>
</body>
